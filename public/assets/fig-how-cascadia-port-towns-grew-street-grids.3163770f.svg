<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 596" width="420" height="596" role="img" aria-labelledby="t">
  <title id="t">Dot chart of street grids in 21 coastal towns by bearing from true north, folded to minus 45 to plus 45 degrees, with each grid's share of street length. One grid: Astoria, Raymond, Montesano, Ilwaco, Long Beach, Ocean Shores, Oysterville, Tokeland, McCleary, Pe Ell, Forks, Naselle. Two grids: Aberdeen, Hoquiam, Port Angeles, South Bend, Cosmopolis, Elma, Westport. Three grids: Port Townsend, Port Gamble.</title>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; fill: #e8eaf0; }
    .title { font-size: 16px; font-weight: 600; }
    .sec { fill: #a0a8b8; }
    .main { fill: #7dd3c0; }
    .other { fill: #f5c451; }
    .grid { stroke: #a0a8b8; stroke-width: 1; opacity: 0.35; }
    .zero { stroke: #a0a8b8; stroke-width: 1.5; opacity: 0.8; }
    @media (prefers-color-scheme: light) {
      text { fill: #12151c; }
      .sec { fill: #4a5263; }
      .main { fill: #0a735f; }
      .other { fill: #8a6100; }
      .grid { stroke: #4a5263; }
      .zero { stroke: #4a5263; }
    }
  </style>
  <text class="title" x="16" y="26">Street grids in 21 coastal towns, by bearing</text>
  <text class="sec" x="16" y="46">Dot size and label: the grid's share of street length.</text>
  <line class="grid" x1="100.0" y1="74" x2="100.0" y2="540"/>
  <text class="sec" x="100.0" y="68" text-anchor="middle">-45</text>
  <line class="grid" x1="141.7" y1="74" x2="141.7" y2="540"/>
  <text class="sec" x="141.7" y="68" text-anchor="middle">-30</text>
  <line class="grid" x1="183.3" y1="74" x2="183.3" y2="540"/>
  <text class="sec" x="183.3" y="68" text-anchor="middle">-15</text>
  <line class="zero" x1="225.0" y1="74" x2="225.0" y2="540"/>
  <text class="sec" x="225.0" y="68" text-anchor="middle">0</text>
  <line class="grid" x1="266.7" y1="74" x2="266.7" y2="540"/>
  <text class="sec" x="266.7" y="68" text-anchor="middle">+15</text>
  <line class="grid" x1="308.3" y1="74" x2="308.3" y2="540"/>
