<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 396" width="420" height="396" role="img" aria-labelledby="t">
  <title id="t">The order a PBRMaterial builds its shader: source loaded, includes expanded, plugin code injected, preprocessor evaluates the conditionals, result to the driver</title>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #e8eaf0; }
    .title { font-size: 16px; font-weight: 600; }
    .sec { fill: #a0a8b8; font-size: 13px; }
    .hi { fill: #7dd3c0; font-weight: 600; }
    .box { fill: none; stroke: #3a3f4b; stroke-width: 1.5; }
    .box-hi { fill: none; stroke: #7dd3c0; stroke-width: 2.5; }
    .arrow { fill: #a0a8b8; }
    .stem { stroke: #a0a8b8; stroke-width: 1.5; }
    @media (prefers-color-scheme: light) {
      text { fill: #12151c; }
      .sec { fill: #4a5263; }
      .hi { fill: #0a735f; }
      .box { stroke: #c9ced6; }
      .box-hi { stroke: #0a735f; }
      .arrow { fill: #4a5263; }
      .stem { stroke: #4a5263; }
    }
  </style>
  <text class="title" x="16" y="26">When plugin code is injected</text>

  <rect class="box" x="16" y="42" width="388" height="40" rx="8"/>
  <text x="32" y="67">1. Shader source loaded from the shader store</text>

  <line class="stem" x1="210" y1="82" x2="210" y2="92"/>
  <path class="arrow" d="M204 92 L216 92 L210 99 Z"/>

  <rect class="box" x="16" y="100" width="388" height="56" rx="8"/>
  <text x="32" y="123">2. ProcessIncludes expands every #include</text>
  <text class="sec" x="32" y="143">include parameters are substituted</text>

  <line class="stem" x1="210" y1="156" x2="210" y2="166"/>
  <path class="arrow" d="M204 166 L216 166 L210 173 Z"/>

  <rect class="box-hi" x="16" y="174" width="388" height="76" rx="8"/>
  <text class="hi" x="32" y="197">3. Plugin code is injected, as plain text</text>
  <text class="sec" x="32" y="217">#include lines no longer exist</text>
  <text class="sec" x="32" y="237">#if and #ifdef are not evaluated yet</text>

  <line class="stem" x1="210" y1="250" x2="210" y2="260"/>
  <path class="arrow" d="M204 260 L216 260 L210 267 Z"/>

  <rect class="box" x="16" y="268" width="388" height="56" rx="8"/>
  <text x="32" y="291">4. ProcessShaderConversion evaluates #if, #ifdef</text>
  <text class="sec" x="32" y="311">against the material's defines, then migrates GLSL</text>

  <line class="stem" x1="210" y1="324" x2="210" y2="334"/>
  <path class="arrow" d="M204 334 L216 334 L210 341 Z"/>

  <rect class="box" x="16" y="342" width="388" height="40" rx="8"/>
  <text x="32" y="367">5. The result goes to the driver</text>
</svg>
