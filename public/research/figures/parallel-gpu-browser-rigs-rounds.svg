<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="440" height="300" role="img" aria-labelledby="t">
  <title id="t">Wall-clock time of a round of 40 experiment-tiers by number of rigs: 16 h 40 min on 1, 4 h 10 min on 4, 2 h 5 min on 8, 1 h 40 min on 10, 50 min on 20</title>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #e8eaf0; }
    .title { font-size: 16px; font-weight: 600; }
    .sec { fill: #a0a8b8; }
    .bar { fill: #a0a8b8; }
    .pick { fill: #7dd3c0; }
    .pickt { font-weight: 600; fill: #7dd3c0; }
    .axis { stroke: #3a3f4b; stroke-width: 1.5; }
    @media (prefers-color-scheme: light) {
      text { fill: #12151c; }
      .sec, .bar { fill: #4a5263; }
      .pick, .pickt { fill: #0a735f; }
      .axis { stroke: #c9ced6; }
    }
  </style>
  <text class="title" x="16" y="28">A round of 40 experiment-tiers, wall-clock</text>
  <text class="sec" x="16" y="50">25 min each, one experiment per GPU</text>

  <!-- Scale: 1000 min (16 h 40 min) = 300 px, bars start at x = 76. -->
  <text class="sec" x="16" y="92">1 rig</text>
  <rect class="bar" x="76" y="78" width="300" height="20" rx="3"/>
  <text x="76" y="118">16 h 40 min</text>

  <text class="sec" x="16" y="152">4 rigs</text>
  <rect class="bar" x="76" y="138" width="75" height="20" rx="3"/>
  <text x="159" y="153">4 h 10 min</text>

  <text class="sec" x="16" y="187">8 rigs</text>
  <rect class="bar" x="76" y="173" width="37.5" height="20" rx="3"/>
  <text x="121" y="188">2 h 5 min</text>

  <text class="pickt" x="16" y="222">10 rigs</text>
  <rect class="pick" x="76" y="208" width="30" height="20" rx="3"/>
  <text class="pickt" x="114" y="223">1 h 40 min, the recommendation</text>

  <text class="sec" x="16" y="257">20 rigs</text>
  <rect class="bar" x="76" y="243" width="15" height="20" rx="3"/>
  <text x="99" y="258">50 min</text>

  <line class="axis" x1="76" y1="72" x2="76" y2="270"/>
  <text class="sec" x="16" y="290">The GPU hours, and so the cost, are the same at every count.</text>
</svg>
