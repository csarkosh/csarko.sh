<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" width="440" height="470" role="img" aria-labelledby="t">
  <title id="t">Six GPU memory savings in a browser game, in megabytes, on the medium tier at 1280 by 720. Allocated too big or kept twice, nothing lost: sign atlas 21, identical model images stored once 18, stand-in car released 2.5. Stored in a smaller form with the error measured: vertex formats and 16-bit indices 30, animation tables at two texels a bone 27, material record per vertex 17. The six add to 115.5 megabytes; the page's own count fell from 651 to 535 megabytes, 116 less.</title>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #e8eaf0; }
    .title { font-size: 16px; font-weight: 600; }
    .sec { fill: #a0a8b8; }
    .good { fill: #7dd3c0; }
    .small { fill: #a0a8b8; }
    .base { stroke: #a0a8b8; stroke-width: 1; }
    @media (prefers-color-scheme: light) {
      text { fill: #12151c; }
      .sec { fill: #4a5263; }
      .good { fill: #0a735f; }
      .small { fill: #4a5263; }
      .base { stroke: #4a5263; }
    }
  </style>
  <text class="title" x="16" y="28">Six savings, in MB of GPU memory</text>
  <text class="sec" x="16" y="50">Medium tier, 1280x720: 651 MB before, 535 MB after</text>

  <text class="sec" x="16" y="88">Allocated too big or kept twice: 41.5 MB, nothing lost</text>
  <text x="16" y="114">Sign atlas sized to what it holds</text>
  <rect class="good" x="16" y="122" width="210" height="20" rx="3"/>
  <text x="234" y="137">21</text>
  <text x="16" y="160">Identical model images stored once</text>
  <rect class="good" x="16" y="168" width="180" height="20" rx="3"/>
  <text x="204" y="183">18</text>
  <text x="16" y="206">Stand-in car released</text>
  <rect class="good" x="16" y="214" width="25" height="20" rx="3"/>
  <text x="49" y="229">2.5</text>

  <text class="sec" x="16" y="272">Stored smaller, error measured: 74 MB</text>
  <text x="16" y="298">Vertex formats and 16-bit indices</text>
  <rect class="small" x="16" y="306" width="300" height="20" rx="3"/>
  <text x="324" y="321">30</text>
  <text x="16" y="344">Animation tables, two texels a bone</text>
  <rect class="small" x="16" y="352" width="270" height="20" rx="3"/>
  <text x="294" y="367">27</text>
  <text x="16" y="390">Material record per vertex, 24 to 16 bytes</text>
  <rect class="small" x="16" y="398" width="170" height="20" rx="3"/>
  <text x="194" y="413">17</text>

  <line class="base" x1="16" y1="426" x2="336" y2="426"/>
  <line class="base" x1="16" y1="426" x2="16" y2="432"/>
  <text class="sec" x="16" y="450" text-anchor="middle">0</text>
  <line class="base" x1="116" y1="426" x2="116" y2="432"/>
  <text class="sec" x="116" y="450" text-anchor="middle">10</text>
  <line class="base" x1="216" y1="426" x2="216" y2="432"/>
  <text class="sec" x="216" y="450" text-anchor="middle">20</text>
  <line class="base" x1="316" y1="426" x2="316" y2="432"/>
  <text class="sec" x="316" y="450" text-anchor="middle">30</text>
  <text class="sec" x="360" y="450">MB</text>
</svg>
