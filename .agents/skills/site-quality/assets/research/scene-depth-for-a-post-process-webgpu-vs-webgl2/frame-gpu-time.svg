<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 318" width="440" height="318" role="img" aria-labelledby="t">
  <title id="t">GPU time for one frame of Day Hike on a saturated Mac on WebGPU: 1.3 s for the whole frame, 5.5 s for a frame drawn with pipelines pending in the previous build, 4 to 7 s for the same with the prepass and a third shadow cascade. Every device loss followed a frame of about 6 s or more; holding such frames gave 0 losses in 18 runs.</title>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; fill: #e8eaf0; }
    .title { font-size: 16px; font-weight: 600; }
    .sec { fill: #a0a8b8; }
    .val { font-weight: 600; }
    .good { font-weight: 600; fill: #7dd3c0; }
    .bad { fill: #f5c451; }
    .ok { fill: #7dd3c0; }
    .dim { fill: #a0a8b8; }
    .limit { stroke: #f5c451; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .axis { stroke: #3a3f4b; stroke-width: 1.5; }
    @media (prefers-color-scheme: light) {
      text { fill: #12151c; }
      .sec, .dim { fill: #4a5263; }
      .good, .ok { fill: #0a735f; }
      .bad { fill: #8a6100; }
      .limit { stroke: #8a6100; }
      .axis { stroke: #c9ced6; }
    }
  </style>
  <text class="title" x="16" y="28">GPU time for one frame, WebGPU in Chrome</text>
  <text class="sec" x="16" y="50">Day Hike's high tier on a Mac whose GPU it saturates</text>

  <text class="sec" x="256" y="84" text-anchor="middle">6 s</text>
  <line class="limit" x1="256" y1="90" x2="256" y2="252"/>

  <text x="16" y="110">Whole frame, every draw in</text>
  <text class="val" x="424" y="110" text-anchor="end">1.3 s</text>
  <rect class="ok" x="16" y="118" width="52" height="18" rx="3"/>

  <text x="16" y="164">Pipelines pending, previous build</text>
  <text class="val" x="424" y="164" text-anchor="end">5.5 s</text>
  <rect class="dim" x="16" y="172" width="220" height="18" rx="3"/>

  <text x="16" y="218">Pipelines pending, with the prepass</text>
  <text class="val" x="424" y="218" text-anchor="end">4 to 7 s</text>
  <rect class="dim" x="16" y="226" width="160" height="18" rx="3"/>
  <rect class="bad" x="176" y="226" width="120" height="18" rx="3"/>

  <line class="axis" x1="16" y1="100" x2="16" y2="252"/>

  <text class="sec" x="16" y="278">Every device loss followed a frame of about 6 s or more.</text>
  <text class="good" x="16" y="302">Holding those frames: 0 losses in 18 runs</text>
</svg>
