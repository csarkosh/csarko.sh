<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 372" width="440" height="372" role="img" aria-labelledby="t">
  <title id="t">The Well as a timeline of its 122 shots and its loudness. Opening 0:00 to 0:49, office scene 0:49 to 4:03, finale 4:03 to 5:14, credits to 5:29. In the office scene 41 percent of the running time is cutaways to the family's story, the sheriff's theory and photographs. Loudness peaks at the torch flash, the break-in, the wall opening and the last push in, and drops to near silence before the blow and at the cut to black.</title>
