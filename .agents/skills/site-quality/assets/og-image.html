<html lang="en">

    font-family: "JetBrains Mono", monospace; font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; white-space: nowrap;

  .url span { color: #7dd3c0; }
  .portrait {
    width: 300px; height: 375px; border-radius: 28px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 0 0 8px rgba(125, 211, 192, 0.06), 0 30px 80px -24px rgba(125, 211, 192, 0.35);
